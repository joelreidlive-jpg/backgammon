version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns:
          - '@types/*'
          - '@typescript-eslint/*'
          - 'eslint*'
          - 'vite'
          - 'vitest'
          - '@vitejs/*'
          - 'wrangler'
          - 'typescript'
      runtime:
        patterns:
          - 'hono'
          - 'react'
          - 'react-dom'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
